<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRTK — Code Review Tool Kit</title>
    <style>
        /* ----------------------------------------------------------------
           Reset & base
           ---------------------------------------------------------------- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ----------------------------------------------------------------
           Header
           ---------------------------------------------------------------- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }
        header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #e0e0e0;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            background: #0f3460;
            color: #53c0f0;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ----------------------------------------------------------------
           Layout — two-column
           ---------------------------------------------------------------- */
        .container {
            display: flex;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .panel-left  { flex: 0 0 60%; max-width: 60%; }
        .panel-right { flex: 1; min-width: 0; }

        /* ----------------------------------------------------------------
           Controls
           ---------------------------------------------------------------- */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 10px 14px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .controls input[type="text"]:focus {
            border-color: #53c0f0;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #0f3460;
            color: #53c0f0;
        }
        .btn-primary:hover { background: #1a4a8a; }
        .btn-accent {
            background: #e94560;
            color: #fff;
        }
        .btn-accent:hover { background: #ff6b81; }

        /* ----------------------------------------------------------------
           Results area
           ---------------------------------------------------------------- */
        #results {
            transition: opacity 0.3s;
        }
        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #53c0f0;
        }
        .stat-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        }
        .color-green  { color: #2ecc71; }
        .color-yellow { color: #f1c40f; }
        .color-red    { color: #e74c3c; }
        .color-blue   { color: #53c0f0; }

        /* Severity badges */
        .sev {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .sev-critical { background: #e74c3c; color: #fff; }
        .sev-high     { background: #e67e22; color: #fff; }
        .sev-medium   { background: #f1c40f; color: #1a1a2e; }
        .sev-low      { background: #2ecc71; color: #1a1a2e; }

        /* Issue lists */
        .issue-list {
            list-style: none;
            margin-top: 8px;
        }
        .issue-list li {
            padding: 6px 0;
            border-bottom: 1px solid #0f3460;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .issue-list li:last-child { border-bottom: none; }
        .issue-file {
            font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
            color: #888;
            font-size: 0.8rem;
        }
        .issue-msg { color: #e0e0e0; }
        .issue-sug {
            color: #53c0f0;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        /* Recommendations */
        .rec-list {
            list-style: none;
            counter-reset: rec;
        }
        .rec-list li {
            counter-increment: rec;
            padding: 8px 0 8px 28px;
            position: relative;
            font-size: 0.85rem;
            border-bottom: 1px solid #0f3460;
            line-height: 1.4;
        }
        .rec-list li:last-child { border-bottom: none; }
        .rec-list li::before {
            content: counter(rec);
            position: absolute;
            left: 0;
            top: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0f3460;
            color: #53c0f0;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ----------------------------------------------------------------
           Log panel
           ---------------------------------------------------------------- */
        .log-panel h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #53c0f0;
        }
        #log {
            background: #0d1117;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 14px;
            height: 600px;
            overflow-y: auto;
            font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
            font-size: 0.78rem;
            line-height: 1.6;
            color: #8b949e;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-ts   { color: #53c0f0; }
        .log-ok   { color: #2ecc71; }
        .log-err  { color: #e74c3c; }
        .log-warn { color: #f1c40f; }

        /* ----------------------------------------------------------------
           Loading overlay
           ---------------------------------------------------------------- */
        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 46, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #loading-overlay.active {
            display: flex;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #0f3460;
            border-top-color: #53c0f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ----------------------------------------------------------------
           Empty state
           ---------------------------------------------------------------- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }
        .empty-state p {
            font-size: 0.95rem;
            margin-top: 12px;
        }

        /* ----------------------------------------------------------------
           Responsive
           ---------------------------------------------------------------- */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 16px;
            }
            .panel-left, .panel-right {
                flex: none;
                max-width: 100%;
                width: 100%;
            }
            header { padding: 12px 16px; }
            header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<!-- Header -->
<header>
    <h1>CRTK — Code Review Tool Kit</h1>
    <span class="badge" id="version-badge">v1.0.0</span>
</header>

<!-- Main content -->
<div class="container">
    <!-- Left panel: controls + results -->
    <div class="panel-left">
        <div class="controls">
            <input type="text"
                   id="directory-input"
                   placeholder="Enter project directory path…"
                   spellcheck="false">
            <button class="btn btn-primary" onclick="analyzeProject()">
                Scan
            </button>
            <button class="btn btn-accent" onclick="fullReview()">
                Full Review
            </button>
        </div>

        <div id="results">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
                     stroke="#555" stroke-width="1.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>Enter a directory path and click <strong>Scan</strong> or
                   <strong>Full Review</strong> to begin.</p>
            </div>
        </div>
    </div>

    <!-- Right panel: log -->
    <div class="panel-right">
        <div class="log-panel">
            <h3>Activity Log</h3>
            <div id="log"></div>
        </div>
    </div>
</div>

<script>
    /* ================================================================
       Helpers
       ================================================================ */
    function addLog(message, level) {
        var logEl  = document.getElementById('log');
        var ts     = new Date().toLocaleTimeString();
        var cls    = level === 'error' ? 'log-err'
                   : level === 'warn'  ? 'log-warn'
                   : level === 'ok'    ? 'log-ok'
                   : 'log-ts';
        var line   = '<span class="log-ts">[' + ts + ']</span> '
                   + '<span class="' + cls + '">' + escapeHtml(message) + '</span>\n';
        logEl.insertAdjacentHTML('beforeend', line);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function showLoading() {
        document.getElementById('loading-overlay').classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loading-overlay').classList.remove('active');
    }

    function complexityColor(score) {
        if (score < 40) return 'color-green';
        if (score < 70) return 'color-yellow';
        return 'color-red';
    }

    function sevBadge(severity) {
        var cls = 'sev sev-' + severity.toLowerCase();
        return '<span class="' + cls + '">' + escapeHtml(severity) + '</span>';
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
    }

    /* ================================================================
       API calls
       ================================================================ */
    function analyzeProject() {
        var dir = document.getElementById('directory-input').value.trim();
        if (!dir) {
            addLog('Please enter a directory path.', 'warn');
            return;
        }

        showLoading();
        addLog('Starting scan of ' + dir + '…');

        fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: dir })
        })
        .then(function(resp) {
            if (!resp.ok) return resp.json().then(function(d) { throw d; });
            return resp.json();
        })
        .then(function(data) {
            hideLoading();
            addLog('Scan complete — ' + data.files_analyzed + ' files, '
                   + data.total_lines.toLocaleString() + ' lines.', 'ok');
            renderAnalysis(data);
        })
        .catch(function(err) {
            hideLoading();
            var msg = (err && err.error) ? err.error : 'Unknown error';
            addLog('Scan failed: ' + msg, 'error');
            document.getElementById('results').innerHTML =
                '<div class="card"><h3>Error</h3><p class="issue-msg">'
                + escapeHtml(msg) + '</p></div>';
        });
    }

    function fullReview() {
        var dir = document.getElementById('directory-input').value.trim();
        if (!dir) {
            addLog('Please enter a directory path.', 'warn');
            return;
        }

        showLoading();
        addLog('Starting full review of ' + dir + '… (this may take longer)');

        fetch('/api/review', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: dir, use_ai: true })
        })
        .then(function(resp) {
            if (!resp.ok) return resp.json().then(function(d) { throw d; });
            return resp.json();
        })
        .then(function(data) {
            hideLoading();
            addLog('Full review complete — risk score: ' + data.risk_score + '/100', 'ok');
            renderReview(data);
        })
        .catch(function(err) {
            hideLoading();
            var msg = (err && err.error) ? err.error : 'Unknown error';
            addLog('Review failed: ' + msg, 'error');
            document.getElementById('results').innerHTML =
                '<div class="card"><h3>Error</h3><p class="issue-msg">'
                + escapeHtml(msg) + '</p></div>';
        });
    }

    /* ================================================================
       Rendering helpers
       ================================================================ */
    function renderAnalysis(data) {
        var html = '';

        /* Summary card */
        html += '<div class="card">';
        html += '<h3>Summary</h3>';
        html += '<div class="stat-row">';

        html += '<div class="stat"><span class="stat-label">Files</span>'
              + '<span class="stat-value color-blue">'
              + data.files_analyzed + '</span></div>';

        html += '<div class="stat"><span class="stat-label">Lines of Code</span>'
              + '<span class="stat-value color-blue">'
              + data.total_lines.toLocaleString() + '</span></div>';

        var cxCls = complexityColor(data.average_complexity);
        html += '<div class="stat"><span class="stat-label">Avg Complexity</span>'
              + '<span class="stat-value ' + cxCls + '">'
              + data.average_complexity + '</span></div>';

        html += '</div></div>';

        /* Security findings */
        html += renderIssueSection('Security Findings', data.files, 'security_issues');

        /* Performance findings */
        html += renderIssueSection('Performance Findings', data.files, 'performance_issues');

        document.getElementById('results').innerHTML = html;
    }

    function renderReview(data) {
        var html = '';

        /* Risk score card */
        var riskCls = data.risk_score < 30 ? 'color-green'
                    : data.risk_score < 60 ? 'color-yellow'
                    : 'color-red';
        html += '<div class="card">';
        html += '<h3>Risk Assessment</h3>';
        html += '<div class="stat-row">';
        html += '<div class="stat"><span class="stat-label">Risk Score</span>'
              + '<span class="stat-value ' + riskCls + '">'
              + data.risk_score + '/100</span></div>';
        html += '<div class="stat"><span class="stat-label">Files</span>'
              + '<span class="stat-value color-blue">'
              + data.analysis.files_analyzed + '</span></div>';
        html += '<div class="stat"><span class="stat-label">Total Issues</span>'
              + '<span class="stat-value color-yellow">'
              + (sumValues(data.analysis.security_summary)
                 + sumValues(data.analysis.performance_summary))
              + '</span></div>';
        html += '</div></div>';

        /* Summary text */
        html += '<div class="card"><h3>Summary</h3>'
              + '<p style="line-height:1.6;font-size:0.9rem;">'
              + escapeHtml(data.summary) + '</p></div>';

        /* Security findings */
        html += renderIssueSection(
            'Security Findings', data.analysis.files, 'security_issues'
        );

        /* Performance findings */
        html += renderIssueSection(
            'Performance Findings', data.analysis.files, 'performance_issues'
        );

        /* Recommendations */
        if (data.recommendations && data.recommendations.length) {
            html += '<div class="card"><h3>Recommendations</h3>';
            html += '<ol class="rec-list">';
            data.recommendations.forEach(function(rec) {
                html += '<li>' + escapeHtml(rec) + '</li>';
            });
            html += '</ol></div>';
        }

        /* AI insights */
        if (data.ai_insights && data.ai_insights.summary
            && data.ai_insights.summary !== 'AI analysis unavailable') {
            html += '<div class="card"><h3>AI Insights</h3>';
            html += '<p style="margin-bottom:12px;line-height:1.6;font-size:0.9rem;">'
                  + escapeHtml(data.ai_insights.summary) + '</p>';

            if (data.ai_insights.risk_areas && data.ai_insights.risk_areas.length) {
                html += '<p style="color:#53c0f0;font-weight:600;margin-bottom:6px;">'
                      + 'Key Risk Areas</p><ul class="issue-list">';
                data.ai_insights.risk_areas.forEach(function(area) {
                    html += '<li><span class="issue-msg">'
                          + escapeHtml(area) + '</span></li>';
                });
                html += '</ul>';
            }
            html += '</div>';
        }

        document.getElementById('results').innerHTML = html;
    }

    function renderIssueSection(title, files, key) {
        var allIssues = [];
        files.forEach(function(f) {
            (f[key] || []).forEach(function(issue) {
                allIssues.push({ file: f.file, issue: issue });
            });
        });

        if (!allIssues.length) {
            return '<div class="card"><h3>' + escapeHtml(title)
                 + '</h3><p style="color:#2ecc71;font-size:0.9rem;">'
                 + 'No issues found.</p></div>';
        }

        var severityOrder = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };
        allIssues.sort(function(a, b) {
            return (severityOrder[a.issue.severity] || 4)
                 - (severityOrder[b.issue.severity] || 4);
        });

        var html = '<div class="card"><h3>' + escapeHtml(title) + ' ('
                 + allIssues.length + ')</h3>';
        html += '<ul class="issue-list">';
        allIssues.forEach(function(item) {
            var issue = item.issue;
            html += '<li>';
            html += sevBadge(issue.severity) + ' ';
            html += '<span class="issue-file">'
                  + escapeHtml(item.file) + ':' + issue.line + '</span> ';
            html += '<span class="issue-msg">'
                  + escapeHtml(issue.message) + '</span>';
            if (issue.suggestion) {
                html += '<div class="issue-sug">Fix: '
                      + escapeHtml(issue.suggestion) + '</div>';
            }
            html += '</li>';
        });
        html += '</ul></div>';
        return html;
    }

    function sumValues(obj) {
        var total = 0;
        for (var k in obj) { if (obj.hasOwnProperty(k)) total += obj[k]; }
        return total;
    }

    /* ================================================================
       Init
       ================================================================ */
    (function() {
        addLog('CRTK dashboard ready.', 'ok');
        fetch('/api/status')
            .then(function(r) { return r.json(); })
            .then(function(s) {
                document.getElementById('version-badge').textContent = 'v' + s.version;
                addLog('Server v' + s.version + ' — uptime ' + s.uptime + 's');
            })
            .catch(function() {
                addLog('Could not reach server status endpoint.', 'warn');
            });
    })();
</script>

</body>
</html>
